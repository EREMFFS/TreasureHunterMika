<style>
  :root { --bg: #05060c; --fg: #c9d2e3; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font: 13px/1.5 system-ui, sans-serif; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; }
  #loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; }

  @keyframes loadblink { to { visibility: hidden; } }
  .loading-now.ready { left: 0; right: 0; bottom: auto; top: calc(50% + clamp(18px, 3.6vw, 40px)); text-align: center; font-size: clamp(14px, 2.6vw, 30px); color: #ffe7a0; letter-spacing: .12em; animation-duration: 1.1s; }   /* v122 読み込み後の PRESS ANY KEY は社名の下に大きく */

</style>
