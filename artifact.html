<title>Treasure Hunter Mika</title>
<style>
  /* 単一の暗い画面（ゲーム機のモニターとして固定） */
  :root { --bg: #07080f; --fg: #c9d2e3; --dim: #7d87a0; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
         display: flex; align-items: center; justify-content: center; font: 13px/1.5 system-ui, sans-serif; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; outline: none; max-width: 100%; }
  #loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; }
  .loading-now { position: absolute; right: 2.2vw; bottom: 2.2vh; font: bold clamp(9px, 1.4vw, 16px)/1 monospace; letter-spacing: .1em; color: #c9d2e3; animation: loadblink 1s steps(2, start) infinite; }
  @keyframes loadblink { to { visibility: hidden; } }
  .loading-now.ready { left: 0; right: 0; bottom: auto; top: calc(50% + clamp(18px, 3.6vw, 40px)); text-align: center; font-size: clamp(14px, 2.6vw, 30px); color: #ffe7a0; letter-spacing: .12em; animation-duration: 1.1s; }   /* v122 読み込み後の PRESS ANY KEY は社名の下に大きく */
  .loading-credit { font: bold clamp(12px, 2.4vw, 28px)/1 monospace; letter-spacing: .08em; white-space: nowrap; }
  #hint { position: absolute; bottom: 6px; left: 16px; right: 16px; text-align: center; color: var(--dim); font-size: 12px; }
</style>
<div id="loading"><span class="loading-credit">LONKA CORPORATE PRESENTS</span><span class="loading-now">NOW LOADING...</span></div>

<script>

    const c = document.getElementById('screen'), h = document.getElementById('hint');
    const vis = () => (window.MIKA.CRT && window.MIKA.CRT.on ? window.MIKA.CRT.view : c);
    c.addEventListener('pointerdown', () => { c.focus(); });
    window.addEventListener('keydown', () => { h.hidden = true; }, { once: true });
    vis().focus();
  })();
</script>
